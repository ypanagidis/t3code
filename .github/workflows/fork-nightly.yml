# Private fork nightly: merges upstream's newest nightly tag into this branch
# and publishes a Linux AppImage as a release of this repo. Upstream cuts a
# nightly at most every six hours, so a two-hourly check keeps pace; a run with
# no new tag and no new patches stops after the merge. The local
# t3-code-fork-update timer installs the newest release.
#
# `fork` is never pushed: a merge conflict fails this run (GitHub emails you),
# and the fix is merging that tag into `fork` locally + push. The resolution
# then lives in `fork`'s history, so later tags only conflict on new overlap.
# Merge tags, not upstream main, or post-tag main commits ride along. The
# merged source goes to the `nightly` branch instead, which is what the Nix
# flake's users follow; its package is built here and pushed to the attic cache.
name: Fork nightly

on:
  schedule:
    - cron: "23 */2 * * *"
  push:
    branches: [fork]
  workflow_dispatch:
    inputs:
      force:
        description: Build even if nothing changed since the last release
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-nightly
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/pingdotgg/t3code.git
  GH_TOKEN: ${{ github.token }}

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # Upstream's own workflows arrive with every merge; only this one runs here.
      - name: Keep upstream workflows disabled
        run: |
          gh workflow list --repo "$GITHUB_REPOSITORY" --all --json path,state \
            --jq '.[] | select(.state == "active" and .path != ".github/workflows/fork-nightly.yml") | .path' |
            while read -r path; do
              gh workflow disable "$(basename "$path")" --repo "$GITHUB_REPOSITORY" || true
            done

      - uses: actions/checkout@v6
        with:
          ref: fork
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Merge upstream's nightly tag
        id: merge
        run: |
          git config user.name "fork-nightly"
          git config user.email "fork-nightly@users.noreply.github.com"
          tag="$(git ls-remote --tags --refs "$UPSTREAM" 'v*-nightly.*' |
            sed -E 's#.*refs/tags/##' | sort -V | tail -1)"
          # The sparse checkout is a blob:none partial clone, so the merge fetches blobs lazily.
          # Upstream-only blobs exist only upstream, so it has to be a promisor remote too.
          git remote add upstream "$UPSTREAM"
          git config remote.upstream.promisor true
          git config remote.upstream.partialclonefilter blob:none
          git fetch --no-tags upstream "refs/tags/${tag}:refs/upstream-nightly"
          upstream_sha="$(git rev-parse 'refs/upstream-nightly^{commit}')"
          if ! git merge --no-edit -m "Merge upstream ${tag}" refs/upstream-nightly; then
            if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "::error::Merging upstream ${tag} failed before reaching any conflict; see the log above."
              exit 1
            fi
            git diff --name-only --diff-filter=U | sed 's/^/::error::Conflict: /'
            git merge --abort || true
            echo "::error::fork conflicts with upstream ${tag}. Locally: git fetch ${UPSTREAM} tag ${tag} && git checkout fork && git merge ${tag}, resolve, and push fork."
            exit 1
          fi
          tree="$(git rev-parse 'HEAD^{tree}')"
          latest_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ "${{ inputs.force }}" != "true" && -n "$latest_tag" ]] &&
            gh release view "$latest_tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body | grep -q "tree: $tree"; then
            echo "Release $latest_tag already has tree $tree; nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Upstream's nightly version with this run appended keeps nightly
          # behaviour, sorts after the tag it builds on, and never collides.
          version="${tag#v}0${GITHUB_RUN_NUMBER}"
          {
            echo "skip=false"
            echo "version=$version"
            echo "tree=$tree"
            echo "upstream_sha=$upstream_sha"
            echo "upstream_tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        if: steps.merge.outputs.skip != 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        if: steps.merge.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick
          vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Build
        if: steps.merge.outputs.skip != 'true'
        env:
          # T3 Connect's public client config, the same values official builds ship.
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
        run: |
          node scripts/update-release-package-versions.ts "${{ steps.merge.outputs.version }}"
          vp run build:desktop
          # electron-builder needs a feed for nightly versions, so this repo is
          # it; the app can't read a private feed, so the local launcher sets
          # T3CODE_DISABLE_AUTO_UPDATE and the t3-code-fork-update timer installs.
          vp run dist:desktop:artifact \
            --platform linux --target AppImage --arch x64 \
            --build-version "${{ steps.merge.outputs.version }}" \
            --skip-build --verbose

      - name: Publish release
        if: steps.merge.outputs.skip != 'true'
        run: |
          version="${{ steps.merge.outputs.version }}"
          shopt -s nullglob
          appimages=(release/*.AppImage)
          if (( ${#appimages[@]} != 1 )); then
            echo "::error::Expected one AppImage in release/, found ${#appimages[@]}."
            ls -la release || true
            exit 1
          fi
          cp "${appimages[0]}" T3-Code.AppImage
          notes="$(printf 'Upstream: %s (%s)\n\nPatches:\n%s\n\ntree: %s\n' \
            "${{ steps.merge.outputs.upstream_tag }}" \
            "${{ steps.merge.outputs.upstream_sha }}" \
            "$(git log --no-merges --format='- %s' "${{ steps.merge.outputs.upstream_sha }}..HEAD")" \
            "${{ steps.merge.outputs.tree }}")"
          gh release create "v$version" T3-Code.AppImage \
            --repo "$GITHUB_REPOSITORY" --target fork \
            --title "$version" --notes "$notes"

      # The branch only moves once the package has built, and the AppImage is
      # published either way; the last step fails the run if this did not pass.
      - name: Free disk for Nix
        if: steps.merge.outputs.skip != 'true'
        run: |
          rm -rf node_modules release T3-Code.AppImage
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: cachix/install-nix-action@v31
        if: steps.merge.outputs.skip != 'true'

      # Login and substituter only: its automatic push would upload every new
      # store path, the pnpm dependencies and sources included.
      - uses: ryanccn/attic-action@v0
        if: steps.merge.outputs.skip != 'true'
        with:
          endpoint: https://cache.nix.devminer.xyz
          cache: ypanagidis-t3code
          token: ${{ secrets.ATTIC_TOKEN }}
          skip-push: true

      - name: Build Nix package and move the nightly branch
        id: nix
        if: steps.merge.outputs.skip != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          # The version stamp was for the AppImage; the branch carries the merged tree as is.
          git checkout -- .
          log="$RUNNER_TEMP/pnpm-deps.log"
          # A merge that moved the lockfile changes the dependency hash; the
          # mismatch error names the right one.
          if ! nix build .#default.pnpmDeps --no-link -L 2>&1 | tee "$log"; then
            got="$(grep -oE 'got: *sha256-[A-Za-z0-9+/=]+' "$log" | grep -oE 'sha256-.*' | tail -1)"
            if [[ -z "$got" ]]; then
              echo "::error::Fetching the pnpm dependencies failed for a reason other than their hash."
              exit 1
            fi
            echo "$got" > nix/pnpm-deps.hash
            git add nix/pnpm-deps.hash
          fi
          out="$(nix build .#default -L --print-out-paths)"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          # One snapshot commit without .github/: GITHUB_TOKEN may not push the
          # upstream workflow changes the merged history carries, and Nix
          # never reads them.
          git rm -r -q --cached .github
          snapshot="$(git commit-tree "$(git write-tree)" \
            -m "nightly ${{ steps.merge.outputs.version }}" \
            -m "Source of the ${{ steps.merge.outputs.version }} release: $(git rev-parse HEAD)")"
          git push --force origin "$snapshot:refs/heads/nightly"

      # The package's runtime closure only; attic skips what cache.nixos.org has.
      - name: Push the Nix package to attic
        if: steps.merge.outputs.skip != 'true' && steps.nix.outcome == 'success'
        continue-on-error: true
        run: attic push --jobs 2 ypanagidis-t3code "${{ steps.nix.outputs.out }}"

      - name: Prune old releases
        if: steps.merge.outputs.skip != 'true'
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[5:][].tagName' |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done

      - name: Report a failed Nix build
        if: steps.merge.outputs.skip != 'true' && steps.nix.outcome == 'failure'
        run: |
          echo "::error::The AppImage was published, but the Nix package did not build; the nightly branch was not moved."
          exit 1
